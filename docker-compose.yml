name: kubeshield

# Redis (the queue) and Postgres (the database). Nothing else runs in Docker in Phase 1.
# Values come from .env. Host ports are bound to 127.0.0.1 so nothing on the
# network can reach them.

services:
  redis:
    image: redis:7-alpine
    # Append-only file: Redis keeps the stream on disk, so a restart does not lose queued events.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Host port 5433 so it never clashes with a Postgres on the machine; inside Docker it is 5432.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:
